services:

  # ============================================================
  # WAF: Nginx + Coraza + OWASP CRS
  # ============================================================
  waf:
    image: ghcr.io/coreruleset/coraza-crs:nginx
    container_name: coraza-elk-nginx

    ports:
      - "8080:8080"

    environment:
      # Backend
      BACKEND: dvwa:80

      # Coraza
      CORAZA_RULE_ENGINE: On
      CORAZA_REQ_BODY_ACCESS: On

      # Audit log
      CORAZA_AUDIT_ENGINE: On  
      CORAZA_AUDIT_LOG: /var/log/coraza/audit.json
      CORAZA_AUDIT_LOG_FORMAT: JSON

      # CRS
      PARANOIA: 1
      BLOCKING_PARANOIA: 1
      ANOMALY_INBOUND: 5
      ANOMALY_OUTBOUND: 4

    volumes:
      - ./coraza-logs:/var/log/coraza

    depends_on:
      - dvwa


  # ============================================================
  # DVWA
  # ============================================================
  dvwa:
    image: ghcr.io/digininja/dvwa:latest
    container_name: dvwa-elk

    environment:
      DB_SERVER: db
      DB_DATABASE: dvwa
      DB_USER: dvwa
      DB_PASSWORD: p@ssw0rd
      DB_PORT: 3306

    depends_on:
      - db


  # ============================================================
  # MariaDB
  # ============================================================
  db:
    image: mariadb:10
    container_name: dvwa-elk-db

    environment:
      MYSQL_ROOT_PASSWORD: dvwa
      MYSQL_DATABASE: dvwa
      MYSQL_USER: dvwa
      MYSQL_PASSWORD: p@ssw0rd

    volumes:
      - dvwa-db:/var/lib/mysql


  # ============================================================
  # Elasticsearch
  # ============================================================
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    container_name: coraza-elasticsearch

    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.ml.enabled=true
      - ES_JAVA_OPTS=-Xms1g -Xmx1g

    ports:
      - "9200:9200"

    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fs http://localhost:9200/_cluster/health || exit 1"
        ]
      interval: 10s
      timeout: 5s
      retries: 20


  # ============================================================
  # Logstash
  # ============================================================
  logstash:
    image: docker.elastic.co/logstash/logstash:8.15.1
    container_name: coraza-logstash

    environment:
      - LS_JAVA_OPTS=-Xms256m -Xmx512m

    volumes:
      - ./coraza-logs:/var/log/coraza:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro

    depends_on:
      elasticsearch:
        condition: service_healthy


  # ============================================================
  # Kibana
  # ============================================================
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.1
    container_name: coraza-kibana

    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200

    ports:
      - "5601:5601"

    depends_on:
      elasticsearch:
        condition: service_healthy


# ==============================================================
# Persistencia
# ==============================================================
volumes:

  dvwa-db:
  elasticsearch-data:
